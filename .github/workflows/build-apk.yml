name: Build test APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android tools
        env:
          NOWELL_ANDROID_TOOLS: ${{ runner.temp }}/nowell-tools
        run: bash scripts/setup-android.sh
      - name: Build debug APK
        env:
          NOWELL_ANDROID_TOOLS: ${{ runner.temp }}/nowell-tools
        run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: School-Nowell-test-APK
          path: builds/
